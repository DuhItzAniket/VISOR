name: Desktop bundles

# Manual builds produce inspectable artifacts; they do not publish a release.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native build targets
        type: choice
        options: [all, macos-intel, linux]
        default: all

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'macos-intel' && '["macos-15-intel"]' || inputs.target == 'linux' && '["ubuntu-22.04"]' || '["windows-2022","macos-14","macos-15-intel","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-shape0 libxcb-keysyms1 libxcb-icccm4 xvfb xauth
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements/desktop-build.txt
          python -m pip install --no-deps .
      - name: Core regression checks without model dependencies
        run: |
          python -m pip install pytest ruff
          python -m pytest -q -m "not optional_model"
          python -m ruff check src tests scripts
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build bundle and host installer
        run: python scripts/build_desktop.py --package
      - name: Windows bundled workflow smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath dist/VISOR/VISOR.exe -ArgumentList '--smoke-check', 'dist/smoke-report.json' -WindowStyle Hidden -PassThru
          if (-not $appProcess.WaitForExit(90000)) { Stop-Process -Id $appProcess.Id; throw "Bundled smoke check timed out" }
          if ($appProcess.ExitCode -ne 0) { throw "Bundled smoke check failed" }
      - name: macOS bundled workflow smoke check
        if: runner.os == 'macOS'
        run: dist/VISOR.app/Contents/MacOS/VISOR --smoke-check dist/smoke-report.json
      - name: Linux bundled workflow smoke check
        if: runner.os == 'Linux'
        run: dist/VISOR/VISOR --smoke-check dist/smoke-report.json
      - name: Read smoke check result
        run: python -c "import json; r=json.load(open('dist/smoke-report.json')); print(r); assert r['success']"
      - name: Verify installed workflow on Windows or macOS
        if: runner.os != 'Linux'
        run: python scripts/verify_installer.py
      - name: Verify Linux install, workflow and removal without external networking
        if: runner.os == 'Linux'
        run: |
          sudo -n /usr/bin/unshare --net -- \
            /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            /usr/bin/env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            QT_OPENGL=software QT_XCB_GL_INTEGRATION=none CUDA_VISIBLE_DEVICES=-1 \
            /usr/bin/xvfb-run -a -s "-screen 0 1280x800x24 -nolisten tcp -extension GLX" \
            "$(command -v python)" scripts/verify_installer.py
      - name: Prepare validation candidate and checksums
        run: python scripts/prepare_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VISOR-${{ runner.os }}-${{ runner.arch }}-audit
          path: |
            dist/build-info.json
            dist/artifact-inventory.json
            dist/smoke-report.json
            dist/installer-report.json
            dist/system-notice-manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: VISOR-Linux-${{ runner.arch }}-system-notices
          path: dist/system-notices.zip
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VISOR-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/release-candidate/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: VISOR-${{ runner.os }}-${{ runner.arch }}-failed-packages
          path: |
            dist/installers/*
            dist/build-info.json
            dist/smoke-report.json
            dist/installer-report.json
          if-no-files-found: warn
