[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visor-registration"
version = "0.2.0"
description = "Desktop workspace for visual feature matching and planar object registration"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python-headless>=4.9",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.11",
]
build = [
    "pyinstaller>=6.10",
    "pillow>=10",
]
learned = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
visor = "visor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"visor" = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["optional_model: requires installed optional inference runtime and model weights"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.mypy]
files = [
    "src/visor/ui/image_loader.py",
    "src/visor/ui/project_loader.py",
    "src/visor/ui/widgets/image_drop.py",
    "src/visor/smoke_check.py",
    "src/visor/evaluate.py",
    "src/visor/evaluation_data.py",
    "src/visor/model_runtime.py",
    "src/visor/calibration.py",
    "src/visor/learned_pair.py",
    "src/visor/matching_strategies.py",
    "src/visor/learned_engines.py",
    "src/visor/learned_extra.py",
    "src/visor/video.py",
    "src/visor/sweeps.py",
    "src/visor/ui/main_window.py",
    "scripts/create_stress_manifest.py",
    "scripts/evaluate_pair_manifest.py",
    "scripts/verify_source_wheel.py",
]

# Core checks must not install model runtimes just to resolve optional imports.
# Our adapter/result contracts still run through the normal type checker.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*", "lightglue", "lightglue.*"]
ignore_missing_imports = true
