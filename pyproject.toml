[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "visor-registration"
version = "0.2.0"
description = "Desktop workspace for visual feature matching and planar object registration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.11",
]
build = [
    "pyinstaller>=6.10",
    "pillow>=10",
]
learned = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
visor = "visor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"visor" = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
