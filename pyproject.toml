[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visor-registration"
version = "0.1.0"
description = "Desktop workspace for visual feature matching and planar object registration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.11"]
build = ["pyinstaller>=6.10", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visor = ["assets/*.svg", "assets/*.ico", "assets/icons/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["visor"]
ignore_missing_imports = true
warn_unused_ignores = true
